<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engagement Slot Machine</title>
<meta name="description" content="Pull the lever. Win a generic X post.">
<style>
  :root { --gold:#ffcf3f; --red:#d7263d; --x:#1d9bf0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; color:#fff; font:15px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; gap:16px;
    background:#120024 url(/engagement-slots/art/background.webp) center / cover fixed; }
  h1 { margin:4px 0 0; font-size:clamp(20px, 5vw, 30px); text-shadow:0 0 12px #ff3fd0; text-align:center; }

  /* Cabinet art (art/cabinet.webp, cropped to 710:1110). Window and panel positions are measured from the image, in %. */
  .machine { --cw:min(calc(100vw - 70px), 380px, 50dvh); display:flex; align-items:flex-start; justify-content:center; width:100%; }
  .machine .lever { margin:max(calc(var(--cw) * .6125 - 196px), 0px) 0 0 -14px; } /* sits on the cabinet's side stub */
  .cabinet { container-type:inline-size; position:relative; width:var(--cw); aspect-ratio:710 / 1110; background:url(/engagement-slots/art/cabinet.webp) center / contain no-repeat; filter:drop-shadow(0 0 30px #ff3fd088); }
  .window { position:absolute; top:36.04%; width:17.89%; height:16.76%; overflow:hidden; border-radius:4px; background:#fff3f8; container-type:size; }
  .window:nth-child(1) { left:16.62%; } .window:nth-child(2) { left:40.28%; } .window:nth-child(3) { left:64.08%; }
  .strip { will-change:transform; }
  .item { height:100cqh; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
  .item span { font-size:30cqh; }
  .item b { font:900 48cqh Impact, system-ui, sans-serif; color:#e0006b; text-shadow:0 2px 0 #ffcf3f; }
  .panel { position:absolute; left:14.79%; top:70.54%; width:69.3%; height:13.42%; display:flex; align-items:center; justify-content:center; text-align:center;
    color:#b0004e; font:900 4.5cqw/1.15 Impact, system-ui, sans-serif; letter-spacing:.5px; padding:0 4%; }
  .panel.win { color:#fff; background:#e0006b; animation:flash .25s steps(2) infinite; }
  @keyframes flash { 50% { background:#ffcf3f; color:#e0006b; } }

  /* Lever */
  .lever { width:46px; height:230px; position:relative; flex:none; cursor:grab; touch-action:none; user-select:none; }
  .lever .rod { position:absolute; left:19px; top:46px; width:8px; height:150px; background:linear-gradient(90deg, #888, #eee, #888); border-radius:4px; transform-origin:bottom; transition:transform .25s; z-index:2; }
  .lever .knob { position:absolute; left:3px; top:22px; width:40px; height:40px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ff8a9a, var(--red) 60%, #6d0010); box-shadow:0 4px 10px #0008; transition:transform .25s; z-index:3; }
  .lever .base { position:absolute; left:6px; top:168px; width:34px; height:56px; border-radius:10px; z-index:1; background:linear-gradient(#555, #222); } /* black hinge; the arm swings in front of it */
  .lever.down .rod { transform:scaleY(-.65); } .lever.down .knob { transform:translateY(252px); }
  .lever.busy { cursor:wait; }

  /* Post card */
  .card { width:100%; max-width:600px; background:#fff; color:#0f1419; border-radius:16px; padding:14px 16px; display:none; gap:12px; box-shadow:0 10px 30px #0008; }
  .card.show { display:flex; animation:pop .3s; }
  @keyframes pop { from { transform:scale(.9); opacity:0; } }
  .avatar { width:48px; height:48px; border-radius:50%; flex:none; background:url(/engagement-slots/art/avatar.webp) center / cover; }
  .who { font-weight:800; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .who span { color:#536471; font-weight:400; }
  .text { white-space:pre-line; margin:4px 0 10px; font-size:16px; }
  .meta { display:flex; justify-content:space-between; color:#536471; font-size:13px; max-width:420px; }
  .stats { width:100%; max-width:600px; display:none; flex-direction:column; gap:6px; }
  .stats.show { display:flex; }
  .stat { background:#000a; border:1px solid #ffffff22; border-radius:10px; padding:8px 12px; font-size:14px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { font:800 16px system-ui; border:0; border-radius:999px; padding:12px 22px; cursor:pointer; }
  #post { background:var(--x); color:#fff; display:none; } #post.show { display:inline-block; }
  .hint { color:#fffc; font-size:13px; text-align:center; }

  /* Jackpot */
  #jackpot { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; background:#000e; z-index:5; padding:16px; text-align:center; }
  #jackpot.show { display:flex; }
  #jackpot .trophy { width:min(70vw, 340px); aspect-ratio:1; border-radius:20px; background:url(/engagement-slots/art/jackpot.webp) center / cover; box-shadow:0 0 40px #ffcf3f; }
  #jackpot h2 { font:900 clamp(22px, 6vw, 40px) Impact, system-ui, sans-serif; color:var(--gold); margin:0; text-shadow:0 0 16px #ff3fd0; }
  .confetti { position:fixed; top:-30px; z-index:6; pointer-events:none; animation:fall linear forwards; font-size:18px; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  @media (max-width:520px) { .lever { transform:scale(.8); } }
</style>
</head>
<body>
<h1>🎰 The Engagement Slot Machine</h1>
<div class="machine">
  <div class="cabinet" id="reels"><div class="window"></div><div class="window"></div><div class="window"></div>
    <div class="panel" id="panel">PULL TO GO VIRAL*<br>*you will not go viral</div></div>
  <div class="lever" id="lever" title="Pull me"><div class="rod"></div><div class="base"></div><div class="knob"></div></div>
</div>
<div class="hint" id="hint">Pull the lever (or press space)</div>

<div class="card" id="card">
  <div class="avatar"></div>
  <div style="flex:1;min-width:0">
    <div class="who">Founder 🚀 | Building in public
      <svg width="18" height="18" viewBox="0 0 24 24" aria-label="Verified"><path fill="#1d9bf0" d="M22.5 12.5c0-1.6-.9-3-2.2-3.7.2-1.5-.3-3-1.4-4.1s-2.6-1.5-4.1-1.3C14 2 12.6 1 11 1S8 2 7.2 3.4C5.7 3.2 4.2 3.6 3.1 4.7S1.6 7.3 1.8 8.8C.5 9.5-.3 10.9-.3 12.5s.9 3 2.2 3.7c-.2 1.5.3 3 1.4 4.1s2.6 1.5 4.1 1.3c.8 1.4 2.2 2.4 3.8 2.4s3-.9 3.8-2.4c1.5.2 3-.3 4.1-1.4s1.5-2.6 1.3-4.1c1.4-.7 2.3-2.1 2.3-3.6z"/><path fill="#fff" d="M9.8 16.6 6 12.8l1.4-1.4 2.4 2.4 6.1-6.1 1.4 1.4z"/></svg>
      <span>@founder_grindset · now</span></div>
    <div class="text" id="text"></div>
    <div class="meta"><span>💬 0</span><span>🔁 0</span><span>🤍 0</span><span id="views">📊 4</span></div>
  </div>
</div>
<div class="stats" id="stats"></div>
<div class="actions"><button id="post">Post it 🚀</button></div>

<div id="jackpot"><div class="trophy"></div><h2>CONGRATS. You are now a thought leader.</h2><button id="close" style="background:var(--gold)">Accept my destiny</button></div>

<script>
const REELS = [
  ['gm builders ☀️', 'Unpopular opinion:', 'Reminder for anyone who needs it:', 'Day 47 of building in public.', 'Be honest.',
   'Just hit 312 followers 🙏', 'Nobody is talking about this:', 'Hot take 🔥', 'I quit my 9 to 5 three weeks ago.', "POV: it's 3am."],
  ['Consistency beats talent every single time.', "I'm 27, solo founder, building an AI SaaS that replaces 14 tools.", 'Shipped 3 features today while you were sleeping.',
   '$0 MRR but the vibes are immaculate.', 'Vibe coded a full app in 11 minutes. Zero experience.', 'X Premium acquired. No more excuses.',
   'Your network is your net worth.', "AI won't replace you. Someone using AI will.", 'The algorithm rewards those who show up.', 'Most people will scroll past this. The 1% won\'t.'],
  ['Let\'s connect 🤝', 'What are you building? 👇', "Drop your link and I'll check it out 🔥", 'Like if you agree. Follow for more.', 'Road to 1,000 🚀',
   'Reply "AI" and I\'ll DM you the guide.', 'Agree? 👀', '#buildinpublic #indiehackers #SaaS #AI', "Who's with me? 💪", 'Follow back guaranteed 💯'],
];
const ICONS = [['☀️', '🤔', '📌', '📅', '🫣', '🙏', '🤫', '🔥', '🏃', '🌙'], ['🏆', '🤖', '😴', '💸', '⚡', '💎', '🤝', '🦾', '📈', '💯'], ['🤝', '👇', '🔗', '👍', '🚀', '📩', '👀', '#️⃣', '💪', '💯']];
const STATS = [
  'Predicted reach: 4 impressions (3 are bots)',
  "Engagement: 1 reply, it's 'nice 🔥' from a crypto account",
  'Expected new followers: 0.3',
  'Replies: "Great insight! DM me for a free audit" ×14',
  'Shadowban probability: yes',
  'Your mom liked it. Then unliked it.',
  'Bookmarked by 1 person: you',
  'Reposted by @growth_bot_4417 with no comment',
  'Time until someone replies "this": 4 seconds',
  'Grok summary: "User posted."',
];
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = id => document.getElementById(id), rand = n => Math.floor(Math.random() * n), wait = ms => new Promise(r => setTimeout(r, ms));
const LOOPS = 4, N = 10;


// Sound: pre-baked ElevenLabs effects, decoded up front. Missing files just stay silent.
const ctx = new (window.AudioContext || window.webkitAudioContext)(), sfx = {};
['lever', 'spin', 'stop', 'coin', 'jackpot', 'wahwah'].forEach(k =>
  fetch(`/engagement-slots/audio/${k}.mp3`).then(r => r.ok ? r.arrayBuffer() : Promise.reject())
    .then(b => new Promise((ok, no) => ctx.decodeAudioData(b, ok, no))).then(buf => { sfx[k] = buf; }).catch(() => {}));
function play(k, { loop = false, volume = 1 } = {}) {
  if (!sfx[k]) return null;
  const s = ctx.createBufferSource(), g = ctx.createGain();
  s.buffer = sfx[k]; s.loop = loop; g.gain.value = volume; s.connect(g).connect(ctx.destination); s.start();
  return s;
}

// Reels: each strip repeats the 10 lines a few times; spinning slides it down to the target.
const strips = REELS.map((lines, r) => {
  const w = document.querySelectorAll('.window')[r];
  const s = document.createElement('div'); s.className = 'strip';
  for (let l = 0; l < LOOPS + 1; l++) lines.forEach((t, i) => s.insertAdjacentHTML('beforeend', `<div class="item" title="${t}"><span>${ICONS[r][i]}</span><b>${i + 1}</b></div>`));
  w.append(s);
  return { s, at: rand(N) };
});
const itemH = () => strips[0].s.firstChild.offsetHeight;
function place(st, index, animate, ms) {
  st.s.style.transition = animate ? `transform ${ms}ms cubic-bezier(.15,.7,.25,1.05)` : 'none';
  st.s.style.transform = `translateY(${-index * itemH()}px)`;
}
strips.forEach(st => place(st, st.at, false));
addEventListener('resize', () => strips.forEach(st => place(st, st.at, false)));

let busy = false, pulls = 0, result = [];
async function pull() {
  if (busy) return; busy = true; ctx.resume();
  $('lever').classList.add('down', 'busy'); play('lever');
  ['card', 'stats', 'post'].forEach(id => $(id).classList.remove('show'));
  $('panel').classList.remove('win'); $('panel').textContent = 'GENERATING THOUGHT LEADERSHIP…';
  await wait(350); $('lever').classList.remove('down');
  pulls++;
  const jackpot = pulls === 3 || Math.random() < 0.05;   // the third pull always makes you a thought leader
  const n = rand(N); result = strips.map(() => jackpot ? n : rand(N));
  const spin = play('spin', { loop: true, volume: 0.6 });
  await Promise.all(strips.map(async (st, r) => {
    const ms = 1100 + r * 550;
    place(st, st.at, false); st.s.offsetHeight;          // reset to the first copy, then spin forward
    place(st, result[r] + N * (LOOPS - 1), true, ms);
    await wait(ms); play('stop'); st.at = result[r]; place(st, st.at, false);
  }));
  try { spin?.stop(); } catch {}
  show(result[0] === result[1] && result[1] === result[2]);
  $('lever').classList.remove('busy'); busy = false;
}
function postText() { return result.map((i, r) => REELS[r][i]).join('\n\n'); }
function show(jackpot) {
  $('text').textContent = postText(); $('views').textContent = `📊 ${1 + rand(9)}`;
  $('card').classList.add('show'); $('post').classList.add('show'); $('hint').textContent = 'Pull again for more thought leadership';
  const picks = [...STATS].sort(() => Math.random() - 0.5).slice(0, 3);
  $('stats').innerHTML = picks.map(s => `<div class="stat">📉 ${s}</div>`).join(''); $('stats').classList.add('show');
  $('panel').innerHTML = jackpot ? 'JACKPOT!!!<br>THOUGHT LEADER' : pick(['NO ENGAGEMENT DETECTED', '4 IMPRESSIONS', 'TRY POSTING MORE', 'THE ALGORITHM IS NOT IMPRESSED']);
  $('panel').classList.toggle('win', jackpot);
  if (jackpot) { play('jackpot'); confetti(); $('jackpot').classList.add('show'); }
  else { play('coin'); setTimeout(() => play('wahwah', { volume: 0.8 }), 700); }
}
function confetti() {
  for (let i = 0; i < 120; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.textContent = ['🎉', '✨', '💸', '☑️', '🚀', '💯'][rand(6)];
    c.style.left = Math.random() * 100 + 'vw'; c.style.animationDuration = 2 + Math.random() * 3 + 's'; c.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.append(c); setTimeout(() => c.remove(), 7000);
  }
}

// Lever: click, drag down, or spacebar.
let dragY = null;
$('lever').addEventListener('pointerdown', e => { dragY = e.clientY; $('lever').setPointerCapture(e.pointerId); });
$('lever').addEventListener('pointermove', e => { if (dragY !== null && e.clientY - dragY > 40) { dragY = null; pull(); } });
$('lever').addEventListener('pointerup', () => { if (dragY !== null) { dragY = null; pull(); } });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pull(); } });
$('close').onclick = () => $('jackpot').classList.remove('show');
$('post').onclick = () => open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(postText() + ' (via stupid-apps.vercel.app/engagement-slots)'), '_blank', 'noopener');
</script>
</body>
</html>
